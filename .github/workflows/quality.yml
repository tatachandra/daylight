name: Website checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/check-wellness.mjs
      - run: node scripts/check-fitness.mjs
      - run: node scripts/check-accounts.mjs
      - run: node scripts/check-google-accounts.mjs
      - run: node scripts/check-tech-leaders.mjs
      - run: node scripts/check-device-time.mjs
      - run: node scripts/check-reliability.mjs
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
